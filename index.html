<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Um livro para Nicolly ❤️</title><style>
:root{--ink:#63334a;--rose:#d982a1;--paper:#fffaf4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#fff9fb,#f8e9ed 65%,#eed5df);color:var(--ink);font-family:Georgia,serif;text-align:center;padding:22px 14px}header{margin:12px auto 22px}header small{letter-spacing:.2em;text-transform:uppercase;color:#a45b79;font:11px Arial}h1{font-weight:normal;color:#7b3b59;font-size:clamp(2rem,6vw,3.3rem);margin:10px}header p{color:#96647a}.toolbar,.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px}button{border:1px solid #8e4263;border-radius:99px;background:#8e4263;color:white;padding:11px 16px;cursor:pointer;font:13px Arial}button.alt{background:var(--paper);color:#8e4263}.book{width:min(100%,700px);margin:auto;perspective:1200px}.page{min-height:560px;background:linear-gradient(100deg,#fff8f0,#fffdf8 20%,#fffaf4);border:1px solid #e9cbd5;border-radius:15px;box-shadow:0 22px 40px #6d3c5120;padding:clamp(25px,6vw,58px);display:flex;flex-direction:column;justify-content:center;position:relative;text-align:left;animation:turn .4s ease}.page:before{content:"";position:absolute;inset:12px;border:1px solid #efd8de;border-radius:9px;pointer-events:none}.page h2{font-weight:normal;color:#8e4263;font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.25;margin:0 0 20px;position:relative}.page p{font-size:clamp(1rem,2.4vw,1.13rem);line-height:1.9;margin:0 0 1.1em;white-space:pre-line;position:relative}.ornament{text-align:center;color:#bd6b8c;letter-spacing:.15em;margin-bottom:22px;position:relative}.number{text-align:center;font:11px Arial;letter-spacing:.15em;color:#bd8a9d;margin-top:auto;padding-top:18px}.cover{text-align:center;align-items:center;background:radial-gradient(circle,#fffaf4,#f9e8ed)}.cover h2{font-size:clamp(2rem,7vw,3.4rem);margin:18px 0}.cover p{color:#9a6077;max-width:350px}.heart{font-size:3rem;animation:beat 3s infinite}.sig{font-style:italic;color:#8e4263}.foot{font:11px Arial;color:#a16d82;margin:24px}@keyframes turn{from{opacity:.5;transform:rotateY(-6deg) translateX(6px)}to{opacity:1;transform:none}}@keyframes beat{50%{transform:scale(1.08)}}@keyframes float{to{transform:translateY(-110vh);opacity:0}}.floating{position:fixed;bottom:-30px;pointer-events:none;animation:float 6s linear forwards}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><header><small>um presente feito com carinho</small><h1>Um livro para Nicolly ❤️</h1><p>Vire as páginas no seu tempo. Cada uma foi feita para você.</p></header><div class="toolbar"><button class="alt" id="music">♫ Ativar musiquinha</button><button class="alt" id="hearts">Enviar coraçõezinhos 💗</button></div><main class="book"><article class="page cover" id="page" aria-live="polite"></article></main><div class="controls"><button class="alt" id="prev">← Anterior</button><span id="count" style="font:12px Arial;color:#9c647c;min-width:100px">Capa · 1 de 7</span><button id="next">Próxima →</button></div><p style="font:12px Arial;color:#a16d82">Use os botões para virar as páginas. ❤️</p><div class="foot">Feito com carinho ❤️</div>
<script>
const pages=[
{cover:true,title:"Para uma pessoa especial (nicolly)",orn:"🎂🥳💞",body:["Uma pequena surpresa para você, Nicolly."]},
{title:"Parabéns, anjo sem asas!",orn:"🥰",body:["Parabéns, anjo sem asas! ou melhor, bela dormecidaa, kkk. Não sou muito bom com palavras ou escrita, mas hoje é um dia especial para você. Quero desejar um feliz aniversário e expressar que você é uma pessoa incrível, uma das melhores que conheci. Não direi que é a melhor (embora você realmente seja), pois não quero admitir isso."]},
{title:"Hoje você completa 19 anos",orn:"🙄 👀",body:["Hoje você completa 19 anos   🥳❤️ Tá ficando velha já KKKKKK!","Te desejo tudo de bom nessa vida, que você consiga realizar seus sonhos e seja muito feliz! Que nunca faltem motivos pra sorrir e pessoas boas pra te fazer companhia (tipo eu, óbvio 🙄).","Espero que seu dia seja tão incrível quanto você! Continue sendo essa pessoa maravilhosa, engraçada e meio doidinha KKKs. Que essa nova fase venha cheia de coisas boas e momentos inesquecíveis. E que eu possa estar presente em alguns deles também, né?","Aproveita muito seu dia, você merece tudo de melhor! Feliz aniversário Mb, sua linda!"]},
{title:"Que venham muitos anos",orn:"🎉🫶",body:["Que venham muitos anos pela frente, cheios de aventuras, histórias pra contar e, claro, muitos memes pra compartilhar. Ah, e não deixe ninguém te chamar de \"velha\"! Afinal, você é como um bom vinho: melhora com o tempo (ou pelo menos tenta não azedar) kkk te amo","E tambem hoje é aquele dia especial em que você ganha o direito de comer bolo sem culpa kkk, receber parabéns de pessoas que mal lembravam que você existia e ainda ser chamada de ‘velha’ pelos amigos mais novos. Que sua velinha não acenda só no bolo, mas na sua vida (calma, sem incêndios, ok?). E lembre-se: idade é só um número, mas se passar de 100, vira recordekk! Aproveite seu dia como se amanhã não tivesse dieta. (:"]},
{title:"Mas agora, deixando as brincadeiras de lado",orn:"🌻💞",body:["Mas agora, deixando as brincadeiras de lado e falando seriamente, desejo que você aproveite ao máximo, pois hoje é o seu dia. Não permita que nada estrague esse momento especial. E caso não tenha planos de sair ou celebrar com amigos ou familiares, saiba que estou à disposição. Embora eu não seja a melhor companhia do mundo, farei o meu melhor para ser uma boa companhia para você."]},
{title:"Nós conhecemos há 1 ano",orn:"😊",body:["Nós conhecemos há 1 ano, o tempo passou tão rápido, e ao longo desse 1 ano você se tornou uma pessoa significativa para mim. Embora eu ainda sinta que te conheço pouco, já consigo perceber o quão incrível você é. Desejo ter a oportunidade de conhecê-la mais a fundo e descobrir tudo sobre você. Se você me conceder essa chance, ficarei imensamente feliz."]},
{title:"E mais uma vez, feliz aniversário, meu anjo!",orn:"🌹🌞",body:["E mais uma vez, feliz aniversário, meu anjo! Te amo muito; você é extremamente especial. Continue sendo essa pessoa maravilhosa que é. Hoje é um dia dedicado à felicidade e aos sorrisos; brilhe intensamente, mas não tanto a ponto de fazer o Sol sentir inveja! Que sua vida seja sempre uma comédia com um final feliz. Eu amo você!","Com todo o meu amor, seu futuro quase príncipe, quem sabe? ❤️💍"]}
];
let i=0;const el=document.getElementById('page'),count=document.getElementById('count');
function render(back=false){let p=pages[i];el.className='page'+(p.cover?' cover':'');el.innerHTML=`<div class="ornament">${p.orn}</div>${p.cover?'<div class="heart">❤️</div>':''}<h2>${p.title}</h2>${p.body.map((s,n)=>`<p class="${i===6&&n===1?'sig':''}">${s}</p>`).join('')}${p.cover?'<div class="number">feito especialmente para você</div>':`<div class="number">♡ ${i} ♡</div>`}`;if(back)el.style.animationName='turnBack';else el.style.animationName='turn';count.textContent=i===0?'Capa · 1 de 7':`Página ${i} · 7`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1;document.getElementById('next').textContent=i===pages.length-1?'Fim ❤️':'Próxima →'}
document.getElementById('prev').onclick=()=>{if(i>0){i--;render(true)}};document.getElementById('next').onclick=()=>{if(i<pages.length-1){i++;render()}};render();
function hearts(n=24){if(matchMedia('(prefers-reduced-motion: reduce)').matches)n=4;let chars=['♡','♥','💗','💕'];for(let j=0;j<n;j++){let h=document.createElement('span');h.className='floating';h.textContent=chars[Math.random()*chars.length|0];h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*20+'px';h.style.color=['#d982a1','#b96587','#d6b17b'][Math.random()*3|0];h.style.animationDelay=Math.random()+ 's';document.body.append(h);setTimeout(()=>h.remove(),7500)}}
document.getElementById('hearts').onclick=()=>hearts();
let ctx=null,timer=null,on=false,n=0;const notes=[261.63,329.63,392,329.63,293.66,349.23,392,349.23];function tone(){if(!ctx||!on)return;let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+.65);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.7)}
document.getElementById('music').onclick=async()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();on=!on;let b=document.getElementById('music');if(on){tone();timer=setInterval(tone,700);b.textContent='♫ Desativar musiquinha';b.setAttribute('aria-pressed','true')}else{clearInterval(timer);b.textContent='♫ Ativar musiquinha';b.setAttribute('aria-pressed','false')}};
</script></body></html>
